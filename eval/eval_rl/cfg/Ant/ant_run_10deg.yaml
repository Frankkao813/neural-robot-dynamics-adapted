env:
  env_name: Ant
  env_mode: neural
  model_path: ../../pretrained_models/NeRD_models/Ant/model/nn/model.pt
  num_envs: 1

  max_episode_length: 1600
  reward_bias: 0.
    
  warp_env_cfg:
    task: run
    obs_type: dflex
    # random_reset: True
    camera_tracking: True
    waypoint_tolerance: 0.75
    terminate_on_last_waypoint: true
    random_reset: false
    action_scale: 0.8
    # Warp uses Y-up, so these are (X, Y, Z) waypoints on the ground plane.
    # This is the next step after the single forward waypoint: walk forward,
    # then make one 90-degree turn toward +Z.
    waypoints:
      - [1.9696, 0.0, 0.3473]   # + 2cos(10°),  2sin(10°)
      - [3.8490, 0.0, 1.0313]   # + 2cos(20°),  2sin(20°)
      - [5.5811, 0.0, 2.0313]   # + 2cos(30°),  2sin(30°)
      - [7.1131, 0.0, 3.3169]   # + 2cos(40°),  2sin(40°)
      - [8.8452, 0.0, 4.3169]   # + 2cos(30°),  2sin(30°)
      - [10.7246, 0.0, 5.0010]  # + 2cos(20°),  2sin(20°)
      - [12.6942, 0.0, 5.3482]  # + 2cos(10°),  2sin(10°)
      - [14.6942, 0.0, 5.3482]  # + 2cos(0°),   2sin(0°)
      - [16.6638, 0.0, 5.0010]  # + 2cos(-10°), 2sin(-10°)
      - [18.5432, 0.0, 4.3169]  # + 2cos(-20°), 2sin(-20°)
      - [20.2752, 0.0, 3.3169]  # + 2cos(-30°), 2sin(-30°)
  
rl:
  config:
    name: AntPPO
    max_epochs: 1000
    horizon_length: 32
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1.
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 3000000
    save_best_after: 10
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    minibatch_size: 16384
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_length: 8
    bounds_loss_coef: 0.0001
    
    player:
      determenistic: True
      games_num: 2
      num_actors: 3
      print_stats: True
  
  network:
    mlp:
      units: [128, 64, 32]
      activation: relu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
  



